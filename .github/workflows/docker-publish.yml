name: Build and Publish Docker Fallback Image

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          # Docker tags strictly require lowercase characters
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${LOWER_REPO}" >> $GITHUB_ENV
          echo "FULL_IMAGE=${{ env.REGISTRY }}/${LOWER_REPO}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          echo "Building image for: ${{ env.FULL_IMAGE }}:latest"
          docker build \
            -t ${{ env.FULL_IMAGE }}:latest \
            -t ${{ env.FULL_IMAGE }}:${{ github.sha }} \
            .

      - name: Verify image in container (/health check)
        run: |
          echo "Testing newly built container image..."
          docker run -d --name test-gridwise -p 8000:8000 ${{ env.FULL_IMAGE }}:latest
          sleep 4
          # Verify health endpoint returns status ok
          HEALTH_RES=$(curl -s http://localhost:8000/health)
          echo "Response from /health: $HEALTH_RES"
          echo "$HEALTH_RES" | grep '"status":"ok"' || (docker logs test-gridwise && exit 1)
          echo "Health check passed successfully!"
          docker rm -f test-gridwise

      - name: Push Docker image to GHCR
        run: |
          echo "Pushing images to registry..."
          docker push ${{ env.FULL_IMAGE }}:latest
          docker push ${{ env.FULL_IMAGE }}:${{ github.sha }}
          echo "Successfully published ${{ env.FULL_IMAGE }}:latest"
