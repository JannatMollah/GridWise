name: Build and Publish Docker Fallback Image

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, Test, and Push Docker Image
        run: |
          set -e
          # Convert repository name to lowercase (required by Docker specifications)
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          FULL_IMAGE="${{ env.REGISTRY }}/${LOWER_REPO}"

          echo "===================================================="
          echo "Target Image: ${FULL_IMAGE}:latest"
          echo "===================================================="

          echo "==> Step 1: Building Docker image..."
          docker build \
            -t "${FULL_IMAGE}:latest" \
            -t "${FULL_IMAGE}:${{ github.sha }}" \
            .

          echo "==> Step 2: Testing container healthcheck locally..."
          docker run -d --name test-gridwise -p 8000:8000 "${FULL_IMAGE}:latest"
          sleep 5

          HEALTH_RES=$(curl -s http://localhost:8000/health)
          echo "Response from /health: ${HEALTH_RES}"

          if echo "${HEALTH_RES}" | grep -q '"status":"ok"'; then
            echo "Health check verification passed!"
          else
            echo "Health check failed! Container logs:"
            docker logs test-gridwise
            exit 1
          fi

          docker rm -f test-gridwise

          echo "==> Step 3: Pushing verified image to GHCR..."
          docker push "${FULL_IMAGE}:latest"
          docker push "${FULL_IMAGE}:${{ github.sha }}"

          echo "===================================================="
          echo "SUCCESS: Image published to ${FULL_IMAGE}:latest"
          echo "===================================================="
